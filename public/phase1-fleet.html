<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deliverizon — Phase 1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:#F0F1F3}
#app{display:flex;width:100vw;height:100vh}
#panel{width:44vw;min-width:44vw;height:100vh;background:#FFF;display:flex;flex-direction:column;border-right:1px solid #E5E7EB;box-shadow:4px 0 20px rgba(0,0,0,.04);z-index:1000;overflow:hidden}
.ph{padding:18px 22px 12px;border-bottom:1px solid #F0F0F0}
.pb{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.plogo{width:33px;height:33px;background:#EE0000;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff}
.ptitle{font-size:17px;font-weight:700;color:#1A1A1A;letter-spacing:-.3px}
.psub{font-size:10.5px;color:#6B7280;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.plive{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;color:#6B7280;font-weight:500;flex-wrap:wrap}
.ldot{width:7px;height:7px;background:#10B981;border-radius:50%;animation:pl 2s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 5px rgba(16,185,129,0)}}
.mecb{background:#3B82F6;color:#fff;font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.4px}
.slbl{font-size:8.5px;font-weight:700;color:#9CA3AF;letter-spacing:1.2px;text-transform:uppercase;padding:12px 22px 5px}
#eval-area{padding:0 18px;flex:0 0 auto;min-height:60px}
.ecard{background:#FAFAFA;border-radius:10px;border:1px solid #E5E7EB;border-left:4px solid #3B82F6;padding:14px 16px;animation:ecIn .35s ease-out}
@keyframes ecIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ecard.matched{border-left-color:#10B981;background:#F8FDF9;transition:border-left-color .5s,background .5s}
.ecard-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:2px}
.ecard-route{font-size:10.5px;color:#6B7280;margin-bottom:8px}
.erow{display:flex;align-items:center;padding:5px 8px;border-radius:6px;margin-bottom:3px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s,background .4s}
.erow.vis{opacity:1;transform:translateY(0)}
.erow.matched{background:rgba(16,185,129,.06)}
.erow.dimmed{opacity:.25}
.eid{width:30px;font-weight:700;font-size:11px;color:#1A1A1A;flex:none}
.edist{width:48px;font-size:10px;color:#6B7280;flex:none}
.factors{display:flex;gap:6px;flex:1}
.factor{display:flex;align-items:center;gap:3px}
.fdot{width:14px;height:14px;border-radius:50%;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;transition:background .35s,transform .2s}
.fdot.good{background:#10B981;transform:scale(1.1)}
.fdot.bad{background:#EF4444;transform:scale(1.1)}
.flbl{font-size:8px;color:#9CA3AF;font-weight:600}
.etag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;flex:none;opacity:0;transition:opacity .3s;margin-left:auto}
.etag.show{opacity:1}
.etag.match{background:#D1FAE5;color:#065F46}
.etag.far{background:#FEE2E2;color:#991B1B}
.etag.low{background:#FEF3C7;color:#92400E}
.etag.busy{background:#F3F4F6;color:#9CA3AF}
.eresult{margin-top:10px;padding-top:8px;border-top:1px solid #E5E7EB;opacity:0;transform:translateY(4px);transition:opacity .5s,transform .5s}
.eresult.vis{opacity:1;transform:translateY(0)}
.eres-line{font-size:10.5px;color:#374151;margin:2px 0;display:flex;align-items:center;gap:5px}
.eacc{color:#3B82F6;font-weight:600}
.eidle{padding:14px;text-align:center;color:#C0C0C0;font-size:11px}

.bot-track{padding:0 14px;overflow:hidden}
.bt-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F7F7F7}
.bt-id{font-size:10px;font-weight:700;color:#1A1A1A;width:26px;flex:none}
.bt-bw{flex:1;height:20px;background:#F3F4F6;border-radius:5px;overflow:hidden}
.bt-bar{height:100%;border-radius:5px;transition:width 1s ease-out,background .4s;display:flex;align-items:center;padding:0 7px}
.bt-bt{font-size:7.5px;font-weight:700;color:#fff;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.bt-bar.idle{background:#D1D5DB;width:100%}
.bt-bar.assigned{background:#F59E0B;width:20%;animation:bp2 1s infinite}
@keyframes bp2{0%,100%{opacity:1}50%{opacity:.7}}
.bt-bar.enroute{background:#3B82F6}
.bt-bar.delivering{background:#EE0000}
.bt-bar.delivered{background:#10B981;width:100%}
.bt-bar.returning{background:#3B82F6}
.bt-bar.charging{background:linear-gradient(90deg,#F59E0B,#FCD34D)}
.bt-tk{font-size:8.5px;color:#9CA3AF;width:100px;flex:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.recent-area{flex:1;overflow:hidden;padding:0 18px}
.rc{padding:6px 10px;background:#FAFAFA;border-radius:6px;border:1px solid #F0F0F0;margin-bottom:4px;opacity:.4;font-size:10px;color:#6B7280;display:flex;align-items:center;gap:6px;animation:rcIn .3s ease-out}
@keyframes rcIn{from{opacity:0;transform:translateY(-5px)}to{opacity:.4;transform:translateY(0)}}
.rc-bot{font-weight:700;color:#1A1A1A}.rc-time{font-size:9px;color:#9CA3AF;flex-shrink:0;margin-left:auto}

.sbar{padding:12px 22px;border-top:1px solid #F0F0F0;display:flex;background:#FAFAFA;flex-shrink:0}
.st{flex:1;text-align:center;position:relative}
.st:not(:last-child)::after{content:'';position:absolute;right:0;top:3px;bottom:3px;width:1px;background:#E5E7EB}
.sv{font-size:16px;font-weight:700;color:#1A1A1A}
.sl{font-size:8.5px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.4px;margin-top:1px;font-weight:500}

#mw{flex:1;position:relative;height:100vh}
#map{width:100%;height:100%;background:#e8e8e8}
#net{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:800}
.leaflet-control-zoom,.leaflet-control-attribution{display:none!important}

.tw-m{position:relative;display:flex;flex-direction:column;align-items:center}
.tw-icon{width:28px;height:28px}.tw-icon svg{width:28px;height:28px}
.tw-rings{position:absolute;top:-10px;left:-10px;width:48px;height:48px}
.tw-r{position:absolute;border-radius:50%;border:1px solid rgba(59,130,246,.1);top:50%;left:50%;transform:translate(-50%,-50%)}
.tw-r1{width:32px;height:32px;animation:twr 3s ease-out infinite}
.tw-r2{width:44px;height:44px;animation:twr 3s ease-out infinite .8s}
.tw-r3{width:56px;height:56px;animation:twr 3s ease-out infinite 1.6s}
@keyframes twr{0%{opacity:.35;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.tw-tag{margin-top:1px;font-size:7px;font-weight:700;color:#3B82F6;background:rgba(255,255,255,.9);padding:0 4px;border-radius:2px;font-family:'DM Sans',sans-serif}

.hub-m{display:flex;flex-direction:column;align-items:center}
.hub-box{width:30px;height:30px;background:#990000;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;font-family:'DM Sans',sans-serif;box-shadow:0 2px 10px rgba(153,0,0,.3);border:2px solid rgba(255,255,255,.95)}
.hub-tag{margin-top:2px;white-space:nowrap;font-size:7px;font-weight:700;color:#990000;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:2px;font-family:'DM Sans',sans-serif}
.chrg-i{width:20px;height:20px;background:#F59E0B;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 1px 5px rgba(245,158,11,.25);border:1.5px solid rgba(255,255,255,.9)}
.chrg-t{margin-top:1px;font-size:6px;font-weight:700;color:#92400E;background:rgba(255,255,255,.85);padding:0 3px;border-radius:2px;font-family:'DM Sans',sans-serif}

.bm{position:relative;width:28px;height:28px}
.bm-d{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#EE0000;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(238,0,0,.4);transition:background .4s,transform .3s}
.bm-d.mt{background:#CC9999;box-shadow:0 2px 6px rgba(204,153,153,.25)}
.bm-d.ch{background:#F59E0B;box-shadow:0 2px 6px rgba(245,158,11,.3)}
.bm-d.pop{animation:bpp .5s ease-out}
@keyframes bpp{0%{transform:scale(1)}35%{transform:scale(1.8)}100%{transform:scale(1)}}
.bm-r{position:absolute;top:0;left:0;width:28px;height:28px;border-radius:50%;border:2px solid rgba(238,0,0,.2);animation:bmr 2s infinite}
.bm-r.mt{border-color:rgba(204,153,153,.1);animation-duration:3s}
.bm-r.ch{border-color:rgba(245,158,11,.15);animation-duration:2.5s}
@keyframes bmr{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:0}}
.bm-l{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:600;color:#fff;background:rgba(25,25,25,.8);padding:1px 5px;border-radius:3px;font-family:'DM Sans',sans-serif}
.dest-m{width:14px;height:14px;border-radius:50%;border:2px dashed rgba(238,0,0,.4);animation:dmp 2.5s infinite}
@keyframes dmp{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.5;transform:scale(1.1)}}
.dest-lbl{white-space:nowrap;font-size:8px;font-weight:600;color:#6B7280;background:rgba(255,255,255,.88);padding:1px 4px;border-radius:2px;font-family:'DM Sans',sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sender-pin{width:22px;height:22px;border-radius:50%;background:#EE0000;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(238,0,0,.35);border:2px solid #fff;animation:spIn .35s ease-out}
@keyframes spIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
<div id="panel">
  <div class="ph">
    <div class="pb"><div class="plogo">D</div><div><div class="ptitle">DELIVERIZON</div><div class="psub">Fleet Monitor</div></div></div>
    <div class="plive"><div class="ldot"></div><span><strong style="color:#10B981">5</strong> online</span><span class="mecb">VERIZON 5G MEC</span></div>
  </div>
  <div class="slbl">MEC Dispatch</div>
  <div id="eval-area"><div class="eidle">Awaiting request...</div></div>
  <div class="slbl">Fleet</div>
  <div class="bot-track" id="bot-track"></div>
  <div class="slbl">Recent</div>
  <div class="recent-area" id="recent"></div>
  <div class="sbar">
    <div class="st"><div class="sv" id="sdel">19</div><div class="sl">Deliveries</div></div>
    <div class="st"><div class="sv">17ms</div><div class="sl">Dispatch</div></div>
    <div class="st"><div class="sv">98.4%</div><div class="sl">On-Time</div></div>
  </div>
</div>
<div id="mw"><div id="map"></div><svg id="net" xmlns="http://www.w3.org/2000/svg"></svg></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
window.addEventListener('load',function(){

var map=L.map('map',{center:[42.3385,-71.0905],zoom:15,zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,keyboard:false});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);
setTimeout(function(){map.invalidateSize()},100);
setTimeout(function(){map.invalidateSize()},500);
setTimeout(function(){map.invalidateSize()},1500);

var HUB=[42.3388,-71.0900];
// Towers: off campus on nearby commercial corridors
var T1=[42.3425,-71.0850]; // Huntington Ave / Forsyth area
var T2=[42.3350,-71.0960]; // Columbus Ave / Tremont
var TOWERS=[T1,T2];
var svg=document.getElementById('net'),TICK=40,LOOP=64000;
var twSvg='<svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="14,4 18,24 10,24" fill="#3B82F6" opacity=".9"/><rect x="12" y="2" width="4" height="6" rx="1" fill="#3B82F6"/><circle cx="14" cy="4" r="2" fill="#fff"/><rect x="8" y="22" width="12" height="3" rx="1.5" fill="#3B82F6" opacity=".7"/></svg>';

/* Static map */
L.marker(HUB,{icon:L.divIcon({className:'',html:'<div class="hub-m"><div class="hub-box">H</div><div class="hub-tag">HUB · CHARGING</div></div>',iconSize:[30,44],iconAnchor:[15,15]})}).addTo(map);
[[42.3383,-71.0878],[42.3400,-71.0910]].forEach(function(c){L.marker(c,{icon:L.divIcon({className:'',html:'<div style="display:flex;flex-direction:column;align-items:center"><div class="chrg-i">⚡</div><div class="chrg-t">CHARGING</div></div>',iconSize:[20,28],iconAnchor:[10,10]})}).addTo(map)});
TOWERS.forEach(function(t){L.marker(t,{icon:L.divIcon({className:'',html:'<div class="tw-m"><div class="tw-rings"><div class="tw-r tw-r1"></div><div class="tw-r tw-r2"></div><div class="tw-r tw-r3"></div></div><div class="tw-icon">'+twSvg+'</div><div class="tw-tag">5G</div></div>',iconSize:[28,36],iconAnchor:[14,14]}),zIndexOffset:500}).addTo(map)});
[[42.3370,-71.0928,'West Village'],[42.3383,-71.0878,'Snell Library'],[42.3406,-71.0906,'Marino'],[42.3366,-71.0918,'Int\'l Village'],[42.3389,-71.0882,'Curry Ctr'],[42.3372,-71.0926,'Khoury'],[42.3399,-71.0900,'Ell Hall'],[42.3416,-71.0876,'Stetson East']].forEach(function(l){L.marker([l[0],l[1]],{icon:L.divIcon({className:'',html:'<div class="dest-lbl">'+l[2]+'</div>',iconSize:[66,12],iconAnchor:[33,6]}),interactive:false,zIndexOffset:-100}).addTo(map)});

/* Bots — most start mid-delivery with long routes */
var BD=[
  {id:'D1',p:[42.3378,-71.0915],dc:'',rc:'',st:'delivering',task:'→ West Village',bw:65},
  {id:'D2',p:[42.3400,-71.0880],dc:'',rc:'',st:'delivering',task:'→ Stetson East',bw:40},
  {id:'D3',p:[42.3394,-71.0910],dc:'',rc:'',st:'delivering',task:'→ Ell Hall',bw:55},
  {id:'D4',p:[42.3383,-71.0878],dc:'ch',rc:'ch',st:'charging',task:'78%',bw:60},
  {id:'D5',p:[42.3365,-71.0930],dc:'',rc:'',st:'delivering',task:'→ Int\'l Village',bw:70}
];
var BD_INIT=BD.map(function(b){return{p:b.p.slice(),dc:b.dc,rc:b.rc,st:b.st,task:b.task,bw:b.bw}});

var markers={},routes={},destMk={},sndPins={};
function bIco(b){return L.divIcon({className:'',html:'<div class="bm"><div class="bm-r '+b.rc+'"></div><div class="bm-d '+b.dc+'" id="md-'+b.id+'"></div><div class="bm-l">'+b.id+'</div></div>',iconSize:[28,28],iconAnchor:[14,14]})}
BD.forEach(function(b){markers[b.id]=L.marker(b.p,{icon:bIco(b),zIndexOffset:1000}).addTo(map)});
function setBC(b,d,r){b.dc=d;b.rc=r;markers[b.id].setIcon(bIco(b))}
function popD(id){var d=document.getElementById('md-'+id);if(d){d.classList.add('pop');setTimeout(function(){d.classList.remove('pop')},550)}}
function addRt(id,w){if(routes[id])routes[id].setLatLngs(w);else routes[id]=L.polyline(w,{color:'#5B9BD5',weight:2.5,opacity:.35,dashArray:'7,9',lineCap:'round'}).addTo(map)}
function rmRt(id){if(routes[id])routes[id].setLatLngs([])}
function addDs(id,p){if(destMk[id])map.removeLayer(destMk[id]);destMk[id]=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="dest-m"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map)}
function rmDs(id){if(destMk[id]){map.removeLayer(destMk[id]);delete destMk[id]}}
function addSn(k,p,i){if(sndPins[k])map.removeLayer(sndPins[k]);sndPins[k]=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="sender-pin">'+i+'</div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:900}).addTo(map)}
function rmSn(k){if(sndPins[k]){map.removeLayer(sndPins[k]);delete sndPins[k]}}

/* Movement */
var mv={};
function startMv(id,w,cb){mv[id]={wps:w,wi:0,p:0,done:false,cb:cb||null};addRt(id,w)}
function tickMv(id){
  var s=mv[id];if(!s||s.done)return;
  if(s.wi>=s.wps.length-1){s.done=true;markers[id].setLatLng(s.wps[s.wps.length-1]);rmRt(id);if(s.cb)s.cb();return}
  var a=s.wps[s.wi],b=s.wps[s.wi+1],d=Math.sqrt((a[0]-b[0])**2+(a[1]-b[1])**2);
  s.p+=TICK/Math.max(400,(d/.001)*1300);
  if(s.p>=1){s.wi++;s.p=0;if(routes[id]){var r=s.wps.slice(s.wi);routes[id].setLatLngs(r.length>1?r:[])}
    if(s.wi>=s.wps.length-1){s.done=true;markers[id].setLatLng(s.wps[s.wps.length-1]);rmRt(id);if(s.cb)s.cb();return}}
  var t=Math.min(s.p,1),f=s.wps[s.wi],to=s.wps[Math.min(s.wi+1,s.wps.length-1)];
  markers[id].setLatLng([f[0]+(to[0]-f[0])*t,f[1]+(to[1]-f[1])*t]);
}

/* Pre-start: long staggered deliveries so bots stay active */
function botReturn(b,dest,delay){
  setTimeout(function(){
    b.st='returning';b.task='Returning';b.bw=30;setBC(b,'','');renderTk();
    var hub=HUB;
    startMv(b.id,[[dest[0],dest[1]],[(dest[0]+hub[0])/2,(dest[1]+hub[1])/2],hub],function(){
      setBC(b,'mt','mt');b.st='idle';b.task='Idle';b.bw=100;renderTk()});
  },delay);
}

// D1: delivering to West Village (arrives ~6s)
startMv('D1',[[42.3378,-71.0915],[42.3374,-71.0920],[42.3372,-71.0924],[42.3370,-71.0928]],function(){
  popD('D1');setBC(BD[0],'mt','mt');BD[0].st='delivered';BD[0].task='Delivered ✓';BD[0].bw=100;renderTk();
  botReturn(BD[0],[42.3370,-71.0928],3000);
});
// D2: delivering to Stetson East (arrives ~10s)
startMv('D2',[[42.3400,-71.0880],[42.3404,-71.0878],[42.3408,-71.0876],[42.3412,-71.0876],[42.3416,-71.0876]],function(){
  popD('D2');setBC(BD[1],'mt','mt');BD[1].st='delivered';BD[1].task='Delivered ✓';BD[1].bw=100;renderTk();
  botReturn(BD[1],[42.3416,-71.0876],3500);
});
// D3: delivering to Ell Hall (arrives ~14s)
startMv('D3',[[42.3394,-71.0910],[42.3396,-71.0908],[42.3397,-71.0905],[42.3398,-71.0902],[42.3399,-71.0900]],function(){
  popD('D3');setBC(BD[2],'mt','mt');BD[2].st='delivered';BD[2].task='Delivered ✓';BD[2].bw=100;renderTk();
  botReturn(BD[2],[42.3399,-71.0900],4000);
});
// D5: delivering to Int'l Village (arrives ~18s)
startMv('D5',[[42.3365,-71.0930],[42.3366,-71.0926],[42.3366,-71.0922],[42.3366,-71.0918]],function(){
  popD('D5');setBC(BD[4],'mt','mt');BD[4].st='delivered';BD[4].task='Delivered ✓';BD[4].bw=100;renderTk();
  botReturn(BD[4],[42.3366,-71.0918],4500);
});

/* Network */
var bbLines=[];
function drawBB(){bbLines.forEach(function(l){try{svg.removeChild(l)}catch(e){}});bbLines=[];
  for(var i=0;i<TOWERS.length;i++){for(var j=i+1;j<TOWERS.length;j++){
    var a=map.latLngToContainerPoint(TOWERS[i]),b=map.latLngToContainerPoint(TOWERS[j]);
    var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',a.x);ln.setAttribute('y1',a.y);ln.setAttribute('x2',b.x);ln.setAttribute('y2',b.y);
    ln.setAttribute('stroke','#3B82F6');ln.setAttribute('stroke-width','1');ln.setAttribute('stroke-dasharray','4,8');ln.setAttribute('opacity','.08');
    svg.appendChild(ln);bbLines.push(ln)}}}
drawBB();

function nearTw(pos){var best=0,bd=1e9;TOWERS.forEach(function(t,i){var d=(t[0]-pos[0])**2+(t[1]-pos[1])**2;if(d<bd){bd=d;best=i}});return TOWERS[best]}
var connLines={};
function updateConn(){BD.forEach(function(b){
  if(b.st==='idle'||b.st==='charging'){if(connLines[b.id]){try{svg.removeChild(connLines[b.id])}catch(e){};delete connLines[b.id]}return}
  var bp=map.latLngToContainerPoint(markers[b.id].getLatLng()),tw=nearTw([markers[b.id].getLatLng().lat,markers[b.id].getLatLng().lng]),tp=map.latLngToContainerPoint(tw);

  connLines[b.id].setAttribute('x1',tp.x);connLines[b.id].setAttribute('y1',tp.y);connLines[b.id].setAttribute('x2',bp.x);connLines[b.id].setAttribute('y2',bp.y)})}

var particles=[];
function spawnP(){
  var active=BD.filter(function(b){return b.st!=='idle'&&b.st!=='charging'});
  if(!active.length)return;var b=active[Math.floor(Math.random()*active.length)];
  var bp=map.latLngToContainerPoint(markers[b.id].getLatLng()),tw=nearTw([markers[b.id].getLatLng().lat,markers[b.id].getLatLng().lng]),tp=map.latLngToContainerPoint(tw);
  var toBot=Math.random()>.5;var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','2');dot.setAttribute('fill','#3B82F6');dot.setAttribute('opacity','0');svg.appendChild(dot);
  particles.push({el:dot,sx:toBot?tp.x:bp.x,sy:toBot?tp.y:bp.y,ex:toBot?bp.x:tp.x,ey:toBot?bp.y:tp.y,t:0,dur:1200+Math.random()*800,bid:b.id,tb:toBot})}
function tickP(){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.t+=TICK;var pg=Math.min(p.t/p.dur,1);
  if(p.bid&&p.tb&&markers[p.bid]){var b2=map.latLngToContainerPoint(markers[p.bid].getLatLng());p.ex=b2.x;p.ey=b2.y}
  else if(p.bid&&!p.tb&&markers[p.bid]){var b3=map.latLngToContainerPoint(markers[p.bid].getLatLng());p.sx=b3.x;p.sy=b3.y}
  var x=p.sx+(p.ex-p.sx)*pg,y=p.sy+(p.ey-p.sy)*pg,op=pg<.15?pg/.15:pg>.85?(1-pg)/.15:.35;
  p.el.setAttribute('cx',x);p.el.setAttribute('cy',y);p.el.setAttribute('opacity',String(Math.min(op,.35)));
  if(pg>=1){try{svg.removeChild(p.el)}catch(e){};particles.splice(i,1)}}}
setInterval(spawnP,600);

function firePulse(bid){
  var bpos=markers[bid].getLatLng(),tw=nearTw([bpos.lat,bpos.lng]),tp=map.latLngToContainerPoint(tw),bp=map.latLngToContainerPoint(bpos);
  var mx=(tp.x+bp.x)/2,my=Math.min(tp.y,bp.y)-30;
  var dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','5');dot.setAttribute('fill','#3B82F6');dot.setAttribute('opacity','0');svg.appendChild(dot);
  var trail=document.createElementNS('http://www.w3.org/2000/svg','path');trail.setAttribute('stroke','#3B82F6');trail.setAttribute('stroke-width','2.5');trail.setAttribute('fill','none');trail.setAttribute('opacity','0');svg.appendChild(trail);
  var st=performance.now(),dur=700;
  function anim(now){var t=Math.min((now-st)/dur,1);
    var px=(1-t)*(1-t)*tp.x+2*(1-t)*t*mx+t*t*bp.x,py=(1-t)*(1-t)*tp.y+2*(1-t)*t*my+t*t*bp.y;
    dot.setAttribute('cx',px);dot.setAttribute('cy',py);dot.setAttribute('opacity',String(.8*(1-t*.2)));
    var pt=Math.max(0,t-.12),ppx=(1-pt)*(1-pt)*tp.x+2*(1-pt)*pt*mx+pt*pt*bp.x,ppy=(1-pt)*(1-pt)*tp.y+2*(1-pt)*pt*my+pt*pt*bp.y;
    trail.setAttribute('d','M'+ppx+','+ppy+' L'+px+','+py);trail.setAttribute('opacity',String(.4*(1-t)));
    if(t<1)requestAnimationFrame(anim);
    else{[1,2,3].forEach(function(n){var ring=document.createElementNS('http://www.w3.org/2000/svg','circle');ring.setAttribute('cx',bp.x);ring.setAttribute('cy',bp.y);ring.setAttribute('r','4');ring.setAttribute('fill','none');ring.setAttribute('stroke','#3B82F6');ring.setAttribute('stroke-width',String(2.5-n*.5));ring.setAttribute('opacity','.5');svg.appendChild(ring);var rs=performance.now(),rd=500+n*150;function ra(nn){var rt=Math.min((nn-rs)/rd,1);ring.setAttribute('r',String(4+18*rt));ring.setAttribute('opacity',String(.5*(1-rt)));if(rt<1)requestAnimationFrame(ra);else try{svg.removeChild(ring)}catch(e){}}setTimeout(function(){requestAnimationFrame(ra)},n*100)});popD(bid);setTimeout(function(){try{svg.removeChild(dot);svg.removeChild(trail)}catch(e){}},80)}}
  requestAnimationFrame(anim)}

var delCount=19,recentItems=[];
function renderRecent(){var el=document.getElementById('recent'),h='';recentItems.forEach(function(r){h+='<div class="rc"><span>'+r.icon+'</span><span>'+r.item+' · <span class="rc-bot">'+r.bot+'</span></span><span class="rc-time">'+r.time+'</span></div>'});if(!h)h='<div style="padding:8px;color:#D1D5DB;font-size:10px;text-align:center">—</div>';el.innerHTML=h}

/* ═══ SMOOTH EVAL — uses generation counter to avoid stale refs ═══ */
function runEval(rq,onDone){
  clearEvalTimers();
  evalGen++;
  var gen=evalGen;
  var pfx='e'+gen+'_'; // unique prefix for this eval's DOM ids
  var ea=document.getElementById('eval-area');

  var h='<div class="ecard" id="'+pfx+'card">';
  h+='<div class="ecard-head"><span>'+rq.icon+'</span> '+rq.item+'</div>';
  h+='<div class="ecard-route">'+rq.from+' → '+rq.to+' · '+rq.route+'</div>';
  rq.rows.forEach(function(row,i){
    var rid=pfx+'r'+i;
    if(row.busy){
      h+='<div class="erow" id="'+rid+'"><span class="eid">'+row.id+'</span><span style="flex:1;font-size:9.5px;color:#9CA3AF;font-style:italic">Busy</span><span class="etag busy show">BUSY</span></div>';
    } else {
      h+='<div class="erow" id="'+rid+'"><span class="eid">'+row.id+'</span><span class="edist">'+row.d+'</span>';
      h+='<div class="factors">';
      h+='<div class="factor"><div class="fdot" id="'+pfx+'f'+i+'d"></div><span class="flbl">Dist</span></div>';
      h+='<div class="factor"><div class="fdot" id="'+pfx+'f'+i+'b"></div><span class="flbl">Batt</span></div>';
      h+='<div class="factor"><div class="fdot" id="'+pfx+'f'+i+'c"></div><span class="flbl">Cap</span></div>';
      h+='</div>';
      h+='<span class="etag '+row.tag+'" id="'+pfx+'t'+i+'"></span></div>';
    }
  });
  h+='<div class="eresult" id="'+pfx+'res"><div class="eres-line">→ <strong>'+rq.bot+'</strong> assigned · <span class="eacc">via 5G MEC</span> · '+rq.eta+'</div></div></div>';
  ea.innerHTML=h;

  var lastRowEnd=0;
  rq.rows.forEach(function(row,i){
    var bd=1000+i*850;
    var rid=pfx+'r'+i;
    // Show row
    et(function(){if(evalGen!==gen)return;var el=document.getElementById(rid);if(el)el.classList.add('vis')},bd);

    if(row.busy){
      et(function(){if(evalGen!==gen)return;var el=document.getElementById(rid);if(el)el.classList.add('dimmed')},bd+100);
    } else {
      // Flip factor dots
      et(function(){if(evalGen!==gen)return;var fd=document.getElementById(pfx+'f'+i+'d');if(fd){fd.classList.add(row.dist?'good':'bad');fd.textContent=row.dist?'✓':'✗'}},bd+250);
      et(function(){if(evalGen!==gen)return;var fb=document.getElementById(pfx+'f'+i+'b');if(fb){fb.classList.add(row.batt?'good':'bad');fb.textContent=row.batt?'✓':'✗'}},bd+500);
      et(function(){if(evalGen!==gen)return;
        var fc=document.getElementById(pfx+'f'+i+'c');if(fc){fc.classList.add(row.cap?'good':'bad');fc.textContent=row.cap?'✓':'✗'}
        // Tag + highlight/dim after all factors
        et(function(){if(evalGen!==gen)return;
          var etEl=document.getElementById(pfx+'t'+i);
          var rowEl=document.getElementById(rid);
          if(row.tag==='match'){
            if(etEl){etEl.classList.add('show','match');etEl.textContent='MATCH'}
            if(rowEl)rowEl.classList.add('matched');
          } else {
            if(etEl){etEl.classList.add('show',row.tag);etEl.textContent=row.tag==='far'?'TOO FAR':'LOW BATT'}
            if(rowEl)rowEl.classList.add('dimmed');
          }
        },200);
      },bd+750);
    }
    lastRowEnd=bd+1000;
  });

  // Show result
  et(function(){if(evalGen!==gen)return;
    var card=document.getElementById(pfx+'card');if(card)card.classList.add('matched');
    var res=document.getElementById(pfx+'res');if(res)res.classList.add('vis');
    if(onDone)onDone();
  },lastRowEnd+400);

  // Clear card
  et(function(){if(evalGen!==gen)return;
    ea.innerHTML='<div class="eidle">Awaiting request...</div>';
  },lastRowEnd+2800);
}

/* Dispatch */
function dispatch(rq){
  var botObj=BD.find(function(b){return b.id===rq.bot});
  addSn('s',rq.fPos,rq.ini);
  runEval(rq,function(){
    firePulse(rq.bot);rmSn('s');addDs(rq.bot,rq.tPos);
    if(botObj){
      setBC(botObj,'','');botObj.st='assigned';botObj.task='Assigned';botObj.bw=20;renderTk();
      setTimeout(function(){
        botObj.st='delivering';botObj.task=rq.item+' → '+rq.route.split(' → ')[1];botObj.bw=50;renderTk();
        startMv(rq.bot,rq.wps,function(){
          popD(rq.bot);rmDs(rq.bot);
          botObj.st='delivered';botObj.task='Delivered ✓';botObj.bw=100;setBC(botObj,'mt','mt');renderTk();
          botReturn(botObj,rq.wps[rq.wps.length-1],1500);
        });
      },800);
    }
    delCount++;document.getElementById('sdel').textContent=delCount;addRecent(rq);
  });
}
